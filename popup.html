<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360, initial-scale=1.0" />
    <title>Volume Boost</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app" id="app" data-enabled="false">
      <header class="header">
        <div class="tab-info">
          <div class="favicon-wrap">
            <img id="favicon" alt="" />
          </div>
          <div class="tab-meta">
            <div class="tab-title" id="tabTitle">Active Tab</div>
            <div class="tab-status" id="statusText" role="status" aria-live="polite">Boost Off</div>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enabledToggle" role="switch" aria-label="Boost this tab" />
          <span class="toggle-track" aria-hidden="true"></span>
        </label>
      </header>

      <section class="slider-section">
        <div class="readout-row">
          <div class="readout" id="readout">100%</div>
          <div class="warning" id="warning" role="status">Extreme boost can distort audio.</div>
          <button class="ghost" id="resetBtn" type="button">Reset</button>
        </div>
        <input
          type="range"
          id="boostSlider"
          min="0"
          max="200"
          value="100"
          step="1"
          aria-label="Boost percent"
        />
        <div class="slider-labels">
          <span>0%</span>
          <button
            class="max-button"
            id="maxLabel"
            type="button"
            title="Double-click, or press Enter, to change the maximum"
          >Max 200%</button>
          <form class="max-editor" id="maxEditor" novalidate hidden>
            <label for="maxInput">Max</label>
            <input id="maxInput" type="number" min="1" max="1000" step="1" />
            <span>%</span>
          </form>
        </div>
      </section>

      <section class="presets" id="presets">
        <button class="chip" type="button" data-preset="10">10%</button>
        <button class="chip" type="button" data-preset="50">50%</button>
        <button class="chip" type="button" data-preset="80">80%</button>
        <button class="chip" type="button" data-preset="100">100%</button>
        <button class="chip" type="button" data-preset="120">120%</button>
        <button class="chip" type="button" data-preset="max">MAX</button>
      </section>

      <section class="options">
        <label class="option">
          <input type="checkbox" id="perSiteToggle" />
          Remember per-site
        </label>
        <button class="ghost" id="forgetBtn" type="button">Forget saved sites</button>
      </section>
    </div>

    <script src="lib/common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
